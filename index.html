<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>展示页面</title>
<style>
body{text-align:center;padding:15px;margin:0;}
img{max-width:100%;}
#word{font-size:30px;font-weight:bold;margin-top:18px;}
</style>
</head>
<body>
<img id="imgBox" src="https://raw.githubusercontent.com/selfguo/network/refs/heads/main/%E5%BE%AE%E4%BF%A13.jpg">
<div id="word"></div>

<script>
function refreshState(){
  let t = Date.now();
  // 同域名pages读取状态文件，无raw长缓存
  let url = `https://selfguo.github.io/network/status.txt?t=${t}`;
  fetch(url, {cache:"no-cache"})
  .then(res=>res.text())
  .then(txt=>{
    let val = txt.trim();
    const imgBox = document.getElementById("imgBox");
    const wordDom = document.getElementById("word");
    if(val === "agree"){
      // 显示同意，隐藏图片
      imgBox.style.display = "none";
      wordDom.innerText = "同意";
    }else{
      // 无状态，显示图片、清空文字
      imgBox.style.display = "block";
      wordDom.innerText = "";
    }
  })
  .catch(e=>console.log(e));
}
// 立即执行 + 5秒自动刷新
refreshState();
setInterval(refreshState,5000);
</script>
</body>
</html>

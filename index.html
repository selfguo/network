<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>图片展示</title>
<style>
*{margin: 0; padding: 0; box-sizing: border-box;}
body{padding: 15px; text-align: center;}
img{max-width: 100%; display: block; margin: 0 auto;}
#tipText{font-size: 32px; font-weight: bold; margin-top: 20px; color: #000;}
</style>
</head>
<body>
<!-- 原图链接完全不变 -->
<img src="https://raw.githubusercontent.com/selfguo/network/refs/heads/main/%E5%BE%AE%E4%BF%A13.jpg">
<div id="tipText"></div>

<script>
// 读取状态文件，拼接时间戳清除缓存
function getStatus() {
  const timestamp = Date.now();
  const statusFileUrl = `https://raw.githubusercontent.com/selfguo/network/refs/heads/main/status.txt?t=${timestamp}`;
  fetch(statusFileUrl)
    .then(res => res.text())
    .then(text => {
      const content = text.trim();
      const textDom = document.getElementById('tipText');
      // 文件内容为agree 显示同意，否则清空
      if (content === 'agree') {
        textDom.innerText = '同意';
      } else {
        textDom.innerText = '';
      }
    })
    .catch(err => {
      console.log('状态读取失败：', err);
    })
}
// 页面加载立刻执行一次
getStatus();
// 每10秒自动刷新一次状态，不用手动刷新页面
setInterval(getStatus, 10000);
</script>
</body>
</html>
